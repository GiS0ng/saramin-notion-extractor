<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사람인 공고 추출</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>채용공고 추출</h1>
    <p class="sub">현재 사람인 공고를 Notion DB 형식으로 정리합니다.</p>
    <details id="notionSettings">
      <summary>Notion 연결 설정</summary>
      <div class="settings-body">
        <label for="notionToken">Notion 액세스 토큰</label>
        <div class="secret-row">
          <input id="notionToken" type="password" autocomplete="off" placeholder="ntn_ 또는 secret_로 시작">
          <button id="toggleToken" class="small secondary" type="button">보기</button>
        </div>
        <label for="dataSourceId">데이터 소스 ID</label>
        <input id="dataSourceId" type="text" autocomplete="off">
        <div class="settings-actions">
          <button id="saveSettings" class="secondary" type="button">설정 저장</button>
          <button id="testNotion" class="secondary" type="button">연결 테스트</button>
        </div>
        <button id="deleteToken" class="danger" type="button">저장된 토큰 삭제</button>
        <p class="hint">토큰은 이 브라우저의 확장 프로그램 저장소에만 보관됩니다.</p>
      </div>
    </details>
    <details id="autoSettings">
      <summary>자동 수집 설정</summary>
      <div class="settings-body">
        <p class="hint schedule-hint">매주 월요일 오전 09:00 · 활성 URL 순차 실행</p>
        <div class="limit-grid">
          <label>최근 등록일(일)<input id="recentDays" type="number" min="1" max="30"></label>
          <label>URL당 최대 페이지<input id="maxPagesPerSearch" type="number" min="1" max="50"></label>
          <label>전체 최대 공고<input id="maxJobs" type="number" min="1" max="500"></label>
          <label>최대 재시도<input id="maxRetries" type="number" min="1" max="5"></label>
          <label>최소 간격(초)<input id="minDelaySeconds" type="number" min="1" max="60"></label>
          <label>최대 간격(초)<input id="maxDelaySeconds" type="number" min="1" max="60"></label>
        </div>
        <button id="saveAutoConfig" class="secondary" type="button">자동 수집 제한 저장</button>
        <form id="searchUrlForm">
          <label for="searchName">검색 이름</label>
          <input id="searchName" type="text" maxlength="80" placeholder="예: AI 스마트제조" required>
          <label for="searchUrl">사람인 검색 URL</label>
          <input id="searchUrl" type="url" placeholder="https://www.saramin.co.kr/..." required>
          <div class="settings-actions">
            <button id="saveSearchUrl" type="submit">URL 추가</button>
            <button id="cancelSearchEdit" class="secondary" type="button" hidden>수정 취소</button>
          </div>
        </form>
        <div id="searchUrlList" class="url-list"></div>
        <button id="runAutoCollection" class="auto-test" type="button">지금 자동 수집 테스트</button>
        <button id="stopAutoCollection" class="danger stop-auto" type="button" hidden>자동 수집 중지</button>
        <p id="autoStatus" class="hint" role="status">실행 기록이 없습니다.</p>
        <div id="autoHistory" class="history-list"></div>
      </div>
    </details>
    <button id="scan" type="button">페이지 스캔</button>
    <p id="status" role="status">사람인 공고 페이지에서 실행해 주세요.</p>
    <section id="result" hidden>
      <label>추출 결과</label>
      <textarea id="preview" readonly></textarea>
      <button id="ocr" class="ocr" type="button" hidden>이미지 OCR로 읽기</button>
      <button id="saveNotion" class="notion" type="button">Notion에 저장</button>
      <div id="progress" class="progress" hidden>
        <div><span id="progressText">OCR 준비 중…</span><strong id="progressValue">0%</strong></div>
        <progress id="progressBar" max="100" value="0"></progress>
      </div>
      <div class="actions">
        <button id="copy" class="secondary" type="button">JSON 복사</button>
        <button id="download" class="secondary" type="button">JSON 저장</button>
      </div>
    </section>
  </main>
  <script src="ocr/tesseract.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
