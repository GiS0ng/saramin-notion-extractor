<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사람인 공고 추출</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>채용공고 추출</h1>
    <p class="sub">현재 사람인 공고를 Notion DB 형식으로 정리합니다.</p>
    <button id="scan" type="button">페이지 스캔</button>
    <p id="status" role="status">사람인 공고 페이지에서 실행해 주세요.</p>
    <section id="result" hidden>
      <label>추출 결과</label>
      <textarea id="preview" readonly></textarea>
      <button id="ocr" class="ocr" type="button" hidden>이미지 OCR로 읽기</button>
      <div id="progress" class="progress" hidden>
        <div><span id="progressText">OCR 준비 중…</span><strong id="progressValue">0%</strong></div>
        <progress id="progressBar" max="100" value="0"></progress>
      </div>
      <div class="actions">
        <button id="copy" class="secondary" type="button">JSON 복사</button>
        <button id="download" class="secondary" type="button">JSON 저장</button>
      </div>
    </section>
  </main>
  <script src="ocr/tesseract.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
