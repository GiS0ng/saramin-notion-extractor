name: extension-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run export:skills && git diff --exit-code shared/skill-catalog.json
      - run: npm run package
      - id: version
        run: echo "value=$(node -e "console.log(require('./manifest.json').version)")" >> "$GITHUB_OUTPUT"
      - run: cd dist && zip -r "saramin-notion-extractor-v${{ steps.version.outputs.value }}.zip" saramin-notion-extractor
      - uses: actions/upload-artifact@v4
        with:
          name: saramin-notion-extractor-v${{ steps.version.outputs.value }}
          path: dist/saramin-notion-extractor-v${{ steps.version.outputs.value }}.zip
