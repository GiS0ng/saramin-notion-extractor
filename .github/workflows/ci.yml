name: extension-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: cd dist && zip -r saramin-notion-extractor-v1.0.0.zip saramin-notion-extractor
      - uses: actions/upload-artifact@v4
        with:
          name: saramin-notion-extractor-v1.0.0
          path: dist/saramin-notion-extractor-v1.0.0.zip
